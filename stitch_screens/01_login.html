<div class="relative w-full flex flex-col items-center justify-center pt-4 pb-5 overflow-hidden">
<div class="absolute -top-12 -right-8 w-44 h-44 rounded-full bg-primary-fixed/20 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-8 -left-8 w-36 h-36 rounded-full bg-surface-container-high/40 blur-xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="relative w-20 h-20 mb-3 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full text-outline-variant/30 animate-[spin_40s_linear_infinite]" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="44" stroke-dasharray="3 4"></circle>
<circle cx="50" cy="50" r="38"></circle>
<circle cx="50" cy="50" r="28" stroke-dasharray="2 3"></circle>
</svg>
<div class="w-16 h-16 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center p-2 transform transition-transform active:scale-95 duration-200">
<img alt="GearStock Cog Brand Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1Vrcm0cu_bJyLsSm0QnP4_RD5PRvvTEevVqKyo6xSp8dZhJtob08BNm7dbw3eetkxKqzmi0b0g6-1KcSY65x91SZJZ5m4XtR_Ie5ozmr1H3LZgSXJahAvsAWRbelJboQRNfZ1RxBKYHi1YghbDEmrioYsDkRoJF3N3VVd6qbHZG9Mix_VL2R_SPE_NkAHs8lijciYr_u1AFuWybYWDLLU6LN48-6Aebx8mY5bhi2rcDG-Qgh8t-NHjoC4wu"/>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">GearStock</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium mt-1">Bicycle Workshop &amp; Inventory Management</p>
</div>
</div>
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-md p-5 sm:p-6 flex flex-col gap-4 relative z-10">
<div class="flex items-center justify-between bg-surface-container-low px-3 py-2 rounded-xl">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">warehouse</span>
<div class="flex flex-col text-left">
<span class="font-label-sm text-label-sm text-secondary uppercase font-semibold">Active Terminal</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Central Workshop - Pune</span>
</div>
</div>
<button class="w-8 h-8 rounded-lg bg-surface-container-lowest shadow-sm flex items-center justify-center text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">swap_horiz</span>
</button>
</div>
<form class="flex flex-col gap-4 mt-1" id="loginForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5 text-left">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="identifier">
          Phone or Workshop Email
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            badge
          </span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl pl-11 pr-4 py-3 placeholder:text-secondary/70 focus:outline-none focus:bg-surface-container-lowest focus:ring-0 focus:shadow-md transition-all h-12" id="identifier" name="identifier" placeholder="+91 98765 43210 or staff@gearstock.in" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5 text-left">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="password">
            Mechanic Password
          </label>
<a class="font-label-sm text-label-sm text-primary font-semibold hover:underline" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary pointer-events-none text-[20px]">
            lock
          </span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl pl-11 pr-12 py-3 placeholder:text-secondary/70 focus:outline-none focus:bg-surface-container-lowest focus:ring-0 focus:shadow-md transition-all h-12" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 w-10 h-10 flex items-center justify-center text-secondary hover:text-on-surface active:scale-90 transition-transform" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between py-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<div class="relative">
<input checked="" class="sr-only peer" id="rememberMe" type="checkbox"/>
<div class="w-5 h-5 bg-surface-container-high rounded-md peer-checked:bg-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[16px] font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface select-none">Remember this shop device</span>
</label>
</div>
<button class="w-full h-12 min-h-[48px] bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow-md shadow-primary/25 active:scale-[0.98] transition-all hover:bg-primary-container" type="submit">
<span>Login to Shop</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center justify-center py-1">
<div class="w-full h-[1px] bg-surface-container-high"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-sm text-label-sm text-secondary uppercase font-semibold">Quick Shift Access</span>
</div>
<button class="w-full h-12 min-h-[48px] bg-surface-container text-on-surface rounded-xl font-label-md text-label-md flex items-center justify-center gap-2.5 hover:bg-surface-container-high active:scale-[0.98] transition-all" id="pinLoginBtn" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">dialpad</span>
<span>Switch to 4-Digit Quick Staff PIN</span>
</button>
</div>
<div class="w-full flex flex-col items-center justify-center mt-5 gap-3 text-center">
<a class="inline-flex items-center gap-1.5 font-label-md text-label-md text-secondary hover:text-on-surface transition-colors py-1" href="#">
<span class="material-symbols-outlined text-[16px]">support_agent</span>
<span>Need help? Contact Shop Admin</span>
</a>
<div class="flex items-center gap-2 text-outline text-[11px] font-label-sm">
<span>GearStock OS v3.4.1</span>
<span>•</span>
<span class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span>
        Workshop Server Live
      </span>
</div>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const pinBtn = document.getElementById('pinLoginBtn');
    if (pinBtn) {
      pinBtn.addEventListener('click', function() {
        const identifier = document.getElementById('identifier');
        if (identifier) {
          identifier.placeholder = 'Enter Staff Card ID or Phone';
          identifier.focus();
        }
      });
    }
  })();
</script></main></body></html>
